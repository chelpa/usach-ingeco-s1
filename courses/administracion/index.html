<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración — Mi Semestre</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>

<script src="../../data/site-data.js"></script>
<script src="../../assets/components.js"></script>
<script src="../../assets/nav.js" data-base="../../" data-course="administracion"></script>

<header class="hero hero-page">
  <div class="wrap">
    <div class="breadcrumb"><a href="../../index.html">Inicio</a> / <span id="course-name-crumb"></span></div>
    <div class="eyebrow-rule"></div>
    <div class="eyebrow">Curso</div>
    <h1 class="title" id="course-title"></h1>
    <div class="subtitle">Apuntes, resúmenes y guías de repaso para este ramo.</div>
  </div>
</header>

<div class="wrap">
  <h2 class="section-heading">Material disponible</h2>
  <div id="resource-list" class="resource-list"></div>

  <footer class="site-footer">
    Sitio personal de apuntes · actualizado a mano curso por curso.
  </footer>
</div>

<script>
  var course = window.MI_COMPONENTS.courseById("administracion");
  if (course) {
    document.getElementById("course-title").textContent = course.name;
    document.getElementById("course-name-crumb").textContent = course.shortName;
    document.getElementById("resource-list").innerHTML =
      window.MI_COMPONENTS.renderCourseMaterials({ courseId: course.id, base: "../../" });
  }
</script>

</body>
</html>
